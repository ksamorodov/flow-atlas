apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deploy
spec:
  template:
    spec:
      containers:
        - name: inventory-container
          image: example/inventory:latest
          env:
            - name: RANDOM_NAME
              value: phantom-env-name
            - name: IMAGE
              image: example/redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
